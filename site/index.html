<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenKBS Project</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 { color: #333; margin-bottom: 1rem; }
        p { color: #666; margin-bottom: 2rem; line-height: 1.6; }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>OpenKBS Project</h1>
        <p>Your project is ready. Start building — ask the chat for anything and watch it appear here.</p>
        <a href="#" class="btn" onclick="testAPI()">Test API</a>
        <pre id="result" style="margin-top: 2rem; text-align: left; background: #f5f5f5; padding: 1rem; border-radius: 8px; display: none;"></pre>
    </div>
    <script>
        // The preview URL (p-*.…) serves static files only — the API lives on
        // the production URL. Right after project creation the production
        // environment needs a minute or two, so instead of surfacing a JSON
        // parse error we explain and retry.
        const IS_PREVIEW = /^p-[a-z0-9]+\./.test(location.hostname) || location.port === '6100';
        let retryTimer = null;

        async function testAPI() {
            const result = document.getElementById('result');
            result.style.display = 'block';
            clearTimeout(retryTimer);

            if (IS_PREVIEW) {
                result.textContent = '⏳ This is the preview URL — it serves your site\'s static files only.\n' +
                    'The API runs on your production URL, which is set up automatically\n' +
                    'right after project creation (usually ready within 1–2 minutes).';
                return;
            }

            result.textContent = 'Loading...';
            try {
                const response = await fetch('/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'hello', data: { test: true } })
                });
                const text = await response.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch {
                    // Got HTML back — the /api route isn't wired yet (production
                    // environment still being set up). Retry until it is.
                    result.textContent = '⏳ Setting up production environment… retrying automatically.';
                    retryTimer = setTimeout(testAPI, 10000);
                    return;
                }
                result.textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                result.textContent = '⏳ API not reachable yet (' + e.message + ') — retrying automatically.';
                retryTimer = setTimeout(testAPI, 10000);
            }
        }
    </script>
</body>
</html>
